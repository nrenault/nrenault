name: Production smoke test

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production pages
        env:
          BASE_URL: https://nrenault.com
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --location --max-time 20 \
            --proto '=https' --tlsv1.2 "$BASE_URL/")"
          grep -qi '<title[^>]*>[^<][^<]*</title>' <<<"$body"
          grep -Fqi 'nrenault' <<<"$body"
          echo 'Production smoke checks passed.'
